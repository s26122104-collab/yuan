<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的網頁程式作品集 | Vintage Quest Portfolio</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Changa+One:ital@0;1&family=Montserrat:wght@600;800;900&family=Noto+Sans+TC:wght@500;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- html2canvas CDN (迷因截圖下載) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        /* ==========================================
           COLOR PALETTE DEFINITION & RESET
           ========================================== */
        :root {
            --isabelline: #F4F0EC;      /* 主背景與奶油卡片底色 */
            --vandyke: #664228;          /* 復古深棕邊框、文字與陰影 */
            --pink-lavender: #D9AFCA;  /* 主視覺粉紫蘭點綴色 */
            --reseda-green: #697D58;   /* 復古灰綠點綴色 */
            --butter-yellow: #EFDE9C;  /* Week 3 點綴奶油黃 */
            
            /* 導出衍生色 */
            --vandyke-light: #52341e;
            --locked-bg: #DCD7D2;
            --locked-text: #8C827A;
            --card-bg: #FCFBF9;

            --retro-black: #1A1A1A;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--isabelline);
            background-image: 
                radial-gradient(var(--pink-lavender) 18%, transparent 19%),
                radial-gradient(var(--reseda-green) 18%, transparent 19%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--vandyke);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* 復古紙張質感覆蓋層 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(244, 240, 236, 0.4), rgba(105, 125, 88, 0.1));
            pointer-events: none;
            z-index: 10;
        }

        /* 主容器 */
        .container {
            max-width: 1080px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        /* ==========================================
           HEADER & PROFILE SECTION
           ========================================== */
        .profile-card {
            background: var(--card-bg);
            border: 4px solid var(--vandyke);
            box-shadow: 10px 10px 0px var(--vandyke);
            padding: 30px;
            border-radius: 18px;
            text-align: center;
            margin-bottom: 40px;
            width: 100%;
            max-width: 520px;
            position: relative;
            transform: rotate(-1deg);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
