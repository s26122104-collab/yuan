<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stage 02: 今天吃什麼？ | Vintage Quest Portfolio</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Noto+Sans+TC:wght@500;800;900&family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <style>
        /* ==========================================
           COLOR PALETTE & RETRO DESIGN RESET
           ========================================== */
        :root {
            --isabelline: #F4F0EC;      /* 主背景色 */
            --vandyke: #664228;          /* 復古深棕邊框與文字 */
            --pink-lavender: #D9AFCA;  /* 點綴粉紫 */
            --reseda-green: #697D58;   /* 復古灰綠 */
            --butter-yellow: #EFDE9C;  /* 點綴奶油黃 */
            --card-bg: #FCFBF9;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--isabelline);
            background-image: 
                radial-gradient(var(--pink-lavender) 18%, transparent 19%),
                radial-gradient(var(--reseda-green) 18%, transparent 19%);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--vandyke);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* 復古質感點陣遮罩 */
        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(244, 240, 236, 0.4), rgba(105, 125, 88, 0.1));
            pointer-events: none;
            z-index: 10;
        }

        /* 頁面主容器 */
        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            position: relative;
            z-index: 1;
        }

        /* 復古返回按鈕 */
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            background: var(--card-bg);
            color: var(--vandyke);
            border: 3px solid var(--vandyke);
            box-shadow: 4px 4px 0px var(--vandyke);
            padding: 10px 16px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 24px;
            transition: all 0.2s ease;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--vandyke);
            background: var(--pink-lavender);
        }

        /* 復古卡片本體 */
        .retro-card {
            background-color: var(--card-bg);
            border: 4px solid var(--vandyke);
            border-radius: 20px;
            box-shadow: 10px 10px 0px var(--vandyke);
            padding: 40px 30px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        /* 關卡貼紙 */
        .stage-badge {
            position: absolute;
            top: -16px;
            right: 20px;
            background: var(--reseda-green);
            color: #FFFFFF;
            font-family: 'Changa One', cursive;
            font-size: 0.85rem;
            padding: 4px 12px;
            border: 3px solid var(--vandyke);
            box-shadow: 3px 3px 0px var(--vandyke);
            border-radius: 8px;
            transform: rotate(3deg);
        }

        /* 小標籤 */
        .badge-tag {
            background-color: var(--butter-yellow);
            color: var(--vandyke);
            border: 2px solid var(--vandyke);
            font-family: 'Changa One', cursive;
            font-size: 13px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 10px;
            letter-spacing: 1px;
            display: inline-block;
            margin-bottom: 16px;
        }

        /* 主標題 */
        .title {
            font-family: 'Changa One', 'Noto Sans TC', sans-serif;
            color: var(--vandyke);
            font-size: 2.2rem;
            font-weight: 900;
            text-shadow: 2px 2px 0px var(--pink-lavender);
            margin-bottom: 20px;
            line-height: 1.3;
        }

        /* 美食圖片容器 */
        .image-container {
            width: 100%;
            height: 220px;
            border: 3.5px solid var(--vandyke);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 4px 4px 0px rgba(102, 66, 40, 0.2);
            background-color: #EEE;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 按鈕樣式 */
        .action-group {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn {
            width: 100%;
            padding: 14px 20px;
            font-size: 1.15rem;
            font-weight: 900;
            text-decoration: none;
            border: 3px solid var(--vandyke);
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 4px 4px 0px var(--vandyke);
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--vandyke);
        }

        /* 抽籤按鈕 (奶油黃) */
        .btn-draw {
            background-color: var(--butter-yellow);
            color: var(--vandyke);
        }

        .btn-draw:hover {
            background-color: #e5d38f;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--vandyke);
        }

        /* 馬上出發按鈕 (灰綠色) */
        .btn-map {
            background-color: var(--reseda-green);
            color: #FFFFFF;
        }

        .btn-map:hover {
            background-color: #5b6e4c;
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--vandyke);
        }

        /* 隱藏標籤 */
        .hidden {
            display: none !important;
        }

        /* 🏆 生動彈跳動畫 🏆 */
        .bounce-animation {
            animation: retroBounce 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes retroBounce {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-6deg);
            }
            50% {
                transform: scale(1.15) rotate(4deg);
            }
            70% {
                transform: scale(0.95) rotate(-2deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 返回作品集主頁按鈕 -->
        <a href="../index.html" class="back-btn">
            ⬅ BACK TO QUEST
        </a>

        <!-- 復古抽籤卡片主體 -->
        <main class="retro-card">
            <span class="stage-badge">STAGE 02</span>

            <header class="card-header">
                <span class="badge-tag">TODAY'S SPECIAL</span>
                <!-- 大標題：點擊抽籤後會被彈跳動畫替換 -->
                <h1 id="food-title" class="title">今天吃什麼？</h1>
            </header>

            <!-- 圖片顯示區塊 (預設隱藏) -->
            <div id="image-container" class="image-container hidden">
                <img id="food-image" src="" alt="美食照片">
            </div>

            <!-- 按鈕組 -->
            <div class="action-group">
                <button id="draw-btn" class="btn btn-draw">點我抽籤！</button>
                <a id="map-btn" href="#" target="_blank" class="btn btn-map hidden">馬上出發 📍</a>
            </div>
        </main>
    </div>

    <script>
        // 確保 HTML 載入完成後才執行內部邏輯，避免 null 錯誤
        document.addEventListener('DOMContentLoaded', () => {

            // 1. 定義餐廳名單、圖片網址與搜尋關鍵字
            const foodList = [
                {
                    name: "漢堡王",
                    image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80",
                    query: "漢堡王"
                },
                {
                    name: "丹丹漢堡",
                    image: "https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=600&q=80",
                    query: "丹丹漢堡"
                },
                {
                    name: "得師傅",
                    image: "https://images.unsplash.com/photo-1626082927389-6cd097cdc6ec?auto=format&fit=crop&w=600&q=80",
                    query: "得師傅"
                },
                {
                    name: "外省麵",
                    image: "https://images.unsplash.com/photo-1569718212165-3a8278d5f624?auto=format&fit=crop&w=600&q=80",
                    query: "外省麵"
                },
                {
                    name: "深水食堂",
                    image: "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=600&q=80",
                    query: "深水食堂"
                }
            ];

            // 2. 獲取 HTML DOM 元素
            const foodTitle = document.getElementById('food-title');
            const foodImage = document.getElementById('food-image');
            const imageContainer = document.getElementById('image-container');
            const drawBtn = document.getElementById('draw-btn');
            const mapBtn = document.getElementById('map-btn');

            let isSpinning = false; // 防連點狀態

            // 3. 綁定按鈕點擊事件
            drawBtn.addEventListener('click', () => {
                if (isSpinning) return;
                isSpinning = true;
                drawBtn.disabled = true;

                // 移除舊的動畫 class
                foodTitle.classList.remove('bounce-animation');
                imageContainer.classList.remove('bounce-animation');

                // 滾動效果（快速切換菜單增加抽籤樂趣）
                let counter = 0;
                const timer = setInterval(() => {
                    const tempIndex = Math.floor(Math.random() * foodList.length);
                    foodTitle.textContent = foodList[tempIndex].name;
                    counter++;

                    if (counter > 10) {
                        clearInterval(timer);
                        
                        // 決定最終隨機結果
                        const finalResult = foodList[Math.floor(Math.random() * foodList.length)];
                        
                        // 替換大標題與圖片
                        foodTitle.textContent = `🎉 今天就吃：${finalResult.name}！`;
                        foodImage.src = finalResult.image;
                        
                        // 動態產生 Google 地圖搜尋連結
                        mapBtn.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(finalResult.query)}`;

                        // 顯示圖片與導航按鈕
                        imageContainer.classList.remove('hidden');
                        mapBtn.classList.remove('hidden');

                        // 觸發生動彈跳動畫
                        foodTitle.classList.add('bounce-animation');
                        imageContainer.classList.add('bounce-animation');

                        // 解鎖按鈕
                        isSpinning = false;
                        drawBtn.disabled = false;
                        drawBtn.textContent = "再抽一次！";
                    }
                }, 80);
            });

        });
    </script>
</body>
</html>
